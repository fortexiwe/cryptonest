<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результат генерации изображения</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e2a47;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
        }

        .result-container {
            text-align: center;
            background-color: #2c3e50;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .result-container img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .prompt {
            margin-top: 20px;
            font-size: 18px;
        }

        .download-btn {
            background-color: #3498db;
            color: white;
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        .download-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="result-container">
        <h1>Результат генерации изображения</h1>
        <!-- Отображение сгенерированного изображения -->
        <img src="data:image/png;base64,{{ img_str }}" alt="Generated Image">
        <div class="prompt">Ваш запрос: {{ prompt }}</div>
        <a href="data:image/png;base64,{{ img_str }}" download="generated_image.png">
            <button class="download-btn">Скачать изображение</button>
        </a>
    </div>
</body>
</html>
