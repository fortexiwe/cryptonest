<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генерация изображения</title>
    <style>
        /* Общие стили */
body {
    font-family: 'Arial', sans-serif;
    background-color: #1f1f2e;
    color: #f5f5f5;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

h1 {
    color: #4caf50;
    text-align: center;
    margin-bottom: 20px;
}

form {
    background-color: #2b2b3c;
    padding: 20px 30px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    max-width: 400px;
    width: 100%;
}

label {
    font-size: 16px;
    margin-bottom: 10px;
    display: block;
    color: #cfcfcf;
}

input[type="text"] {
    width: 100%;
    padding: 10px;
    margin: 10px 0 20px;
    border: 1px solid #4caf50;
    border-radius: 5px;
    background-color: #3c3c4d;
    color: #fff;
    font-size: 16px;
}

input[type="text"]::placeholder {
    color: #aaa;
}

button {
    padding: 10px 20px;
    font-size: 16px;
    margin-top: 10px;
    cursor: pointer;
    border: none;
    border-radius: 5px;
    transition: all 0.3s ease;
    font-weight: bold;
}

button[type="button"] {
    background-color: #4caf50;
    color: #fff;
}

button[type="button"]:hover {
    background-color: #43a047;
    box-shadow: 0 4px 8px rgba(76, 175, 80, 0.3);
}

button[type="submit"] {
    background-color: #1e88e5;
    color: #fff;
}

button[type="submit"]:hover {
    background-color: #1565c0;
    box-shadow: 0 4px 8px rgba(30, 136, 229, 0.3);
}

button:disabled {
    background-color: #555;
    cursor: not-allowed;
}

#status {
    margin-top: 15px;
    font-size: 14px;
    color: #ffeb3b;
    text-align: center;
}

/* Стили для зоны загрузки */
#voiceForm {
    display: flex;
    flex-direction: column;
    align-items: center;
}

p {
    margin: 10px 0;
    font-size: 14px;
    color: #cfcfcf;
    text-align: center;
}

    </style>
</head>
<body>
    <h1>Генерация изображения</h1>

    <form id="voiceForm" method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label for="prompt">Введите текст:</label>
        <input type="text" name="prompt" id="prompt" placeholder="Введите текстовый запрос">

        <p>Или запишите голос:</p>
        <button type="button" id="startRecord">🎤 Начать запись</button>
        <button type="button" id="stopRecord" disabled>⏹️ Остановить запись</button>
        <p id="status"></p>

        <input type="file" name="voice_prompt" id="voiceFileInput" style="display: none;">

        <button type="submit">Сгенерировать</button>
    </form>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        const startRecordBtn = document.getElementById('startRecord');
        const stopRecordBtn = document.getElementById('stopRecord');
        const statusLabel = document.getElementById('status');
        const voiceFileInput = document.getElementById('voiceFileInput');
        const voiceForm = document.getElementById('voiceForm');

        startRecordBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.addEventListener('dataavailable', event => {
                    audioChunks.push(event.data);
                });

                mediaRecorder.addEventListener('stop', () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioFile = new File([audioBlob], 'voice_input.webm', { type: 'audio/webm' });

                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(audioFile);
                    voiceFileInput.files = dataTransfer.files;

                    statusLabel.textContent = "Запись завершена. Вы можете отправить форму.";
                });

                mediaRecorder.start();
                statusLabel.textContent = "Идет запись...";
                startRecordBtn.disabled = true;
                stopRecordBtn.disabled = false;
            } catch (error) {
                statusLabel.textContent = "Ошибка доступа к микрофону.";
                console.error('Ошибка доступа к микрофону:', error);
            }
        });

        stopRecordBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                statusLabel.textContent = "Обработка записи...";
                startRecordBtn.disabled = false;
                stopRecordBtn.disabled = true;
            }
        });
    </script>
</body>
</html>
