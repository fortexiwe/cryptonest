<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка файлов</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e2a47, #2c3e50);
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(44, 62, 80, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
        }
        .heading {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .form-group input[type="file"],
        .form-group input[type="password"],
        .form-group select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 5px;
            border: none;
            background-color: #34495e;
            color: #f5f5f5;
            font-size: 14px;
        }
        .form-group input[type="file"] {
            padding: 10px;
        }
        .error-message {
            color: #e74c3c;
            margin-bottom: 15px;
        }
        .submit-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background: linear-gradient(135deg, #2980b9, #1c6fa1);
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            background: #95a5a6;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            text-align: center;
            text-decoration: none;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: #7f8c8d;
        }
        .success-message {
            color: #2ecc71;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="heading">Загрузка файлов</h1>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="files">Выберите файлы:</label>
                <input type="file" name="files" id="files" multiple>
            </div>

            <div class="form-group">
                <label for="upload_type">Тип загрузки:</label>
                <select name="upload_type" id="upload_type">
                    <option value="">Выберите...</option>
                    <option value="Архивирование">Архивирование</option>
                    <option value="Обычная загрузка">Обычная загрузка</option>
                </select>
            </div>
            <div class="form-group">
                <label for="folder">Выберите папку:</label>
                <select name="folder" id="folder">
                    <option value="">Выберите папку...</option>
                    {% for folder in folders %}
                        <option value="{{ folder.id }}">{{ folder.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group" id="password-section">
                <label for="password">Пароль:</label>
                <input type="password" name="password" id="password">
            </div>

            {% if error_message %}
                <div class="error-message">{{ error_message }}</div>
            {% endif %}

            <button type="submit" class="submit-btn">Загрузить</button>
        </form>

        {% if success_message %}
            <div class="success-message">{{ success_message }}</div>
        {% endif %}

        <a href="/" class="back-btn">На главную</a>
    </div>
</body>
</html>
