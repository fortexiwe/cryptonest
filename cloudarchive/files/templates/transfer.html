<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенос файлов</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background: #0d1117;
            padding: 15px 30px;
            text-align: center;
            font-size: 1.5rem;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            width: 90%;
            max-width: 1200px;
            margin-top: 20px;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .file-list, .folder-list {
            width: 100%;
            margin-bottom: 30px;
        }

        .file-card, .folder-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #1f2937;
            margin-bottom: 10px;
            border-radius: 8px;
            box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }

        .file-card:hover, .folder-card:hover {
            transform: scale(1.02);
        }

        .file-name, .folder-name {
            font-size: 1rem;
            margin: 0;
        }

        .transfer-btn {
            background: linear-gradient(45deg, #4a90e2, #00d1ff);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .transfer-btn:hover {
            background: linear-gradient(45deg, #0078c1, #0088cc);
        }
    </style>
</head>
<body>
    <header>
        Перенос файлов
    </header>
    <div class="container">
        <h2 class="section-title">Список файлов</h2>
        <div class="file-list">
            {% for file in files %}
                <div class="file-card">
                    <p class="file-name">{{ file.original_filename }}</p>
                    <form method="post" action="{% url 'transfer' %}">
                        {% csrf_token %}
                        <select name="folder">
                            {% for folder in folders %}
                                <option value="{{ folder.id }}">{{ folder.name }}</option>
                            {% endfor %}
                        </select>
                        <input type="hidden" name="file" value="{{ file.original_filename }}">
                        <button type="submit" class="transfer-btn">Переместить</button>
                    </form>
                </div>
            {% endfor %}
        </div>

        <h2 class="section-title">Список папок</h2>
        <div class="folder-list">
            {% for folder in folders %}
                <div class="folder-card">
                    <p class="folder-name">{{ folder.name }}</p>
                    <p class="folder-date">{{ folder.created_at|date:"d.m.Y H:i" }}</p>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
