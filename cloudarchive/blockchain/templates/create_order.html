<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать ордер</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 50%;
            margin: 50px auto;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
        }
        h1 {
            text-align: center;
            color: #00ff99;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-weight: bold;
        }
        input, select, button {
            padding: 10px;
            border-radius: 5px;
            border: none;
            outline: none;
            font-size: 16px;
        }
        input, select {
            background: #2c2c2c;
            color: #fff;
        }
        button {
            background: #00ff99;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #00cc7a;
        }
        .error {
            color: #ff5555;
            text-align: center;
        }
        .success {
            color: #55ff55;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Создать ордер</h1>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        {% if success %}
        <p class="success">{{ success }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label for="order_type">Тип ордера:</label>
            <select id="order_type" name="order_type">
                <option value="buy">Покупка</option>
                <option value="sell">Продажа</option>
            </select>

            <label for="amount">Количество монет:</label>
            <input type="number" id="amount" name="amount" step="0.01" min="0" required>

            <label for="price_per_unit">Цена за монету (CLT):</label>
            <input type="number" id="price_per_unit" name="price_per_unit" step="0.01" min="0" required>

            <button type="submit">Создать ордер</button>
        </form>
    </div>
</body>
</html>
