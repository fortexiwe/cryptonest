<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #121212;
            color: #E0E0E0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            max-width: 700px;
            background: #1F1F2E;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 30px;
            color: #00D1FF;
        }
        label {
            display: block;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 18px;
            color: #B3B3C2;
            text-align: left;
        }
        select, input[type="checkbox"] {
            width: 100%;
            padding: 16px;
            border: 2px solid #44475A;
            border-radius: 10px;
            background-color: #2D2D3A;
            color: #E0E0E0;
            outline: none;
            font-size: 18px;
            transition: border-color 0.3s, background-color 0.3s;
            margin-bottom: 20px;
        }
        select:focus, .checkbox-container:hover {
            border-color: #00D1FF;
            background-color: #353545;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border: 2px solid #44475A;
            border-radius: 10px;
            background-color: #2D2D3A;
            color: #E0E0E0;
            font-size: 18px;
            transition: background-color 0.3s;
        }
        .checkbox-container label {
            margin-bottom: 0;
        }
        button {
            width: 100%;
            padding: 16px;
            margin-top: 30px;
            background: linear-gradient(90deg, #4A90E2, #00D1FF);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }
        button:hover {
            background: linear-gradient(90deg, #357ABD, #009EC6);
            transform: scale(1.05);
        }
        .home-button {
            background-color: transparent;
            color: #00D1FF;
            border: 2px solid #00D1FF;
            margin-top: 15px;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 12px;
            transition: background-color 0.3s, color 0.3s;
        }
        .home-button:hover {
            background-color: #00D1FF;
            color: #1F1F2E;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Настройки</h1>
    <form method="POST" action="{% url 'settings' %}">
        {% csrf_token %}

        <label for="theme">Выберите тему:</label>
        <select name="theme" id="theme">
            <option value="DARK">Тёмная</option>
            <option value="WHITE">Светлая</option>
        </select>

        <label for="language">Выберите язык:</label>
        <select name="language" id="language">
            <option value="RU">Русский</option>
            <option value="EN">Английский</option>
        </select>

        <label for="display_mode">Режим отображения файлов:</label>
        <select name="display_mode" id="display_mode">
            <option value="GRID">Сетка</option>
            <option value="LIST">Список</option>
        </select>

       

        <div class="checkbox-container">
            <label for="notifications">Получать уведомления:</label>
            <input type="checkbox" name="notifications" id="notifications">
        </div>

        <div class="checkbox-container">
            <label for="storage_alert">Оповещения о хранилище:</label>
            <input type="checkbox" name="storage_alert" id="storage_alert">
        </div>

        <button type="submit">Сохранить изменения</button>
    </form>
    <button class="home-button" onclick="window.location.href='/'">Вернуться на главную</button>
</div>

</body>
</html>
