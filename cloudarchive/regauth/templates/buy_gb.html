<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Покупка гигабайт</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            background-color: #1c2833;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .card-header {
            background-color: #273746;
            color: #17c3b2;
            border-bottom: 2px solid #17c3b2;
            text-align: center;
            padding: 20px;
            font-size: 1.8rem;
        }
        .card-body {
            padding: 30px;
        }
        .btn-custom {
            background-color: #17c3b2;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn-custom:hover {
            background-color: #13a089;
        }
        .form-label {
            font-weight: bold;
        }
        .result-message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .success {
            background-color: #28a745;
            color: white;
        }
        .error {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                Покупка Дополнительных Гигабайт
            </div>
            <div class="card-body">
                <p>1 GB стоит <strong>10 NBM</strong>.</p>
                <form id="buy-gb-form" method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="gb" class="form-label">Введите количество гигабайт:</label>
                        <input type="number" id="gb" name="GB" class="form-control" placeholder="Например: 5" min="1" required>
                    </div>
                    <button type="submit" class="btn btn-custom">Купить</button>
                </form>
                {% if success_message %}
                <div class="result-message success">
                    {{ success_message }}
                </div>
                {% elif error_message %}
                <div class="result-message error">
                    {{ error_message }}
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
