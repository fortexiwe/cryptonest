<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Страница не найдена</title>
    <style>
        /* Основной стиль и фон */
        body {
            background: linear-gradient(135deg, #0b3d3e, #1a4e50);
            color: #e0e1dd;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            margin: 0;
            perspective: 1000px;
            animation: fadeIn 1s ease-in-out;
        }

        /* Анимация появления */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Плавающие частицы на фоне */
        .background-particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #64ffda;
            opacity: 0.7;
            border-radius: 50%;
            animation: float 6s ease-in-out infinite, glow 1.5s ease-in-out infinite alternate;
        }

        /* Случайное движение частиц */
        @keyframes float {
            0% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-40px) translateX(20px); }
            100% { transform: translateY(0) translateX(0); }
        }

        /* Эффект свечения */
        @keyframes glow {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        /* Контейнер для текста */
        .container {
            text-align: center;
            max-width: 600px;
            z-index: 10;
        }

        /* Заголовок */
        .header-404 {
            font-size: 6rem;
            font-weight: bold;
            background: linear-gradient(90deg, #76eec6, #64ffda);
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: slideIn 0.5s ease-out forwards;
        }

        /* Анимация появления заголовка */
        @keyframes slideIn {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Подзаголовок */
        .subtext {
            font-size: 1.5rem;
            color: #a0aec0;
            margin-top: 20px;
            animation: fadeIn 1.5s ease-in-out;
        }

        /* Кнопка возврата */
        .back-button {
            display: inline-block;
            padding: 12px 24px;
            margin-top: 30px;
            font-size: 1rem;
            font-weight: bold;
            color: #0b3d3e;
            background: linear-gradient(135deg, #64ffda, #76eec6);
            border-radius: 12px;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .back-button:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* Позиции частиц */
        .particle-1 { top: 15%; left: 20%; width: 8px; height: 8px; }
        .particle-2 { top: 40%; right: 10%; width: 12px; height: 12px; }
        .particle-3 { bottom: 20%; left: 25%; width: 6px; height: 6px; }
        .particle-4 { bottom: 10%; right: 30%; width: 10px; height: 10px; }
        .particle-5 { top: 30%; left: 50%; width: 14px; height: 14px; }
    </style>
</head>
<body>

    <!-- Контент страницы 404 -->
    <div class="container">
        <div class="header-404">404</div>
        <p class="subtext">Упс! Страница, которую вы ищете, не существует.</p>
        <a href="/" class="back-button">Вернуться на главную</a>
    </div>

    <!-- Частицы на фоне -->
    <div class="background-particle particle-1"></div>
    <div class="background-particle particle-2"></div>
    <div class="background-particle particle-3"></div>
    <div class="background-particle particle-4"></div>
    <div class="background-particle particle-5"></div>

</body>
</html>
